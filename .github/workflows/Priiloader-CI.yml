name: Priiloader-CI

on: 
  push:
  pull_request:
    branches: 
      - master
  workflow_dispatch:

jobs:
  Linux:
    name: Linux
    runs-on: ubuntu-latest

    container:
      image: docker://devkitpro/devkitppc
      options: --cpus 2
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Source Review
        run: cppcheck . -v --std=c99 --std=c++11 --error-exitcode=1 --enable=warning,performance,portability,information,style --suppress=unusedFunction --suppress=unusedStructMember -UDEBUG_MEM2_LEVEL

      - name: PreBuild Actions
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Build
        run: |
          make

      - name: List workspace (debug)
        shell: bash
        run: |
          pwd
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort

      - name: Stage artifacts
        shell: bash
        run: |
          set -e
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          # Collect .dol, .elf, .wad without using \\( \\)
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.dol' -print0 \
            | xargs -0 -I {} cp "{}" "$GITHUB_WORKSPACE/artifacts" || true
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.elf' -print0 \
            | xargs -0 -I {} cp "{}" "$GITHUB_WORKSPACE/artifacts" || true
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -name '*.wad' -print0 \
            | xargs -0 -I {} cp "{}" "$GITHUB_WORKSPACE/artifacts" || true
          echo "Staged files:"
          ls -l "$GITHUB_WORKSPACE/artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: priiloader-${{ github.sha }}
          path: ${{ github.workspace }}/artifacts
          if-no-files-found: error
          retention-days: 30
